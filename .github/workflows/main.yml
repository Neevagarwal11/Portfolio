name: Portfolio Deployment

on: 
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy HTML to S3
        run: aws s3 cp dist/index.html s3://neev-portfolio/ --cache-control "max-age=0, no-cache, no-store, must-revalidate" --content-type "text/html"

      - name: Deploy assets to S3 with long cache
        run: aws s3 sync dist/assets s3://neev-portfolio/assets --cache-control "max-age=31536000, immutable" --delete

      - name: Deploy other files to S3
        run: aws s3 sync dist/ s3://neev-portfolio/ --exclude "index.html" --exclude "assets/*" --cache-control "max-age=3600" --delete

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          if [ ! -z "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
          fi
      
